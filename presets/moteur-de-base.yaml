name: Moteur de base
description: >
  Les dynamiques d'interaction tirées de la littérature (lots 0 à 5 des adaptations) sont
  éteintes : il reste la mécanique de base du moteur v1 (dévoilement, suggestibilité, mensonge,
  activation et corps). Utile pour comparer ou isoler l'effet d'une dynamique.
