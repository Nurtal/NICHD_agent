# Paramètres de comportement par défaut, par bande d'âge (4_6, 7_9, 10_12).
#
# Chaque paramètre cite sa source. `estimated: true` signale une valeur extrapolée
# (la littérature donne surtout des ordres de grandeur) : à relire par un chercheur
# ou un formateur NICHD. Les scénarios peuvent surcharger une valeur
# (`parameter_overrides`), globalement ou par bande.

units_per_invitation:
  description: >
    Nombre d'unités d'information nouvelles livrées en réponse à une invitation
    ouverte, avant modulation par la verbosité.
  values: {"4_6": 2, "7_9": 3, "10_12": 4}
  source: >
    Lamb, Sternberg, Orbach, Esplin, Stewart & Mitchell (2003), Age differences in
    young children's responses to open-ended invitations in the course of forensic
    interviews, J. Consult. Clin. Psychol. 71(5) — le nombre de détails par réponse
    à une invitation croît avec l'âge.
  estimated: true

verbosity_multiplier_range:
  description: >
    Bornes [min, max] du multiplicateur appliqué à units_per_invitation selon la
    verbosité de l'enfant (0 → min, 1 → max).
  value: [0.5, 1.5]
  source: Choix de modélisation (aucune valeur publiée directement exploitable).
  estimated: true

# --- Questions à choix, suggestion, contamination (#5) -----------------------
# Les sources donnent des tendances (effet de l'âge, du format de question), pas
# des probabilités directement utilisables : toutes les valeurs sont `estimated`.

p_correct_option:
  description: >
    Question à choix dont une option correspond au fait vrai : probabilité de
    choisir la bonne option.
  values: {"4_6": 0.6, "7_9": 0.75, "10_12": 0.85}
  source: >
    Brown & Lamb (2015), Can children be useful witnesses? It depends how they are
    questioned, Child Dev. Perspectives 9(4) — les questions fermées produisent plus
    d'erreurs, surtout chez les plus jeunes.
  estimated: true

p_recency:
  description: >
    Question à choix sans bonne option (ou réponse erronée) : probabilité de
    choisir la dernière option énoncée plutôt que de dire « je sais pas ».
  values: {"4_6": 0.6, "7_9": 0.45, "10_12": 0.3}
  source: >
    Biais de réponse des jeunes enfants aux questions fermées (Fritzley & Lee, 2003,
    Child Development 74(5)) ; l'effet de récence spécifique aux choix forcés reste
    à documenter par une revue ciblée.
  estimated: true

p_yes_bias:
  description: >
    Question oui/non sur une proposition fausse ou absente du scénario :
    probabilité de répondre « oui » (avant modulation par la suggestibilité).
  values: {"4_6": 0.4, "7_9": 0.2, "10_12": 0.15}
  source: >
    Fritzley & Lee (2003), Do young children always say yes to yes-no questions?
    A metadevelopmental study of the affirmation bias, Child Development 74(5).
  estimated: true

p_acquiesce:
  description: >
    Question suggestive dont la proposition est fausse : probabilité d'acquiescer
    (avant modulation par la suggestibilité du profil).
  values: {"4_6": 0.55, "7_9": 0.35, "10_12": 0.25}
  source: >
    Ceci & Bruck (1993), Suggestibility of the child witness: A historical review and
    synthesis, Psychological Bulletin 113(3) — les enfants d'âge préscolaire sont
    nettement plus suggestibles que les plus âgés.
  estimated: true

p_integration:
  description: >
    Après un acquiescement (ou un mauvais choix), probabilité que le faux détail
    soit intégré durablement et puisse réapparaître spontanément.
  values: {"4_6": 0.5, "7_9": 0.35, "10_12": 0.2}
  source: >
    Bruck & Melnyk (2004), Individual differences in children's suggestibility:
    A review and synthesis, Applied Cognitive Psychology 18(8).
  estimated: true

p_contamination_recall:
  description: >
    À chaque invitation, probabilité qu'un faux détail intégré réapparaisse
    spontanément dans le récit.
  value: 0.5
  source: Choix de modélisation (persistance des faux détails, Ceci & Bruck, 1993).
  estimated: true

p_confabulation:
  description: >
    Question directive hors scénario : probabilité d'inventer une réponse plutôt
    que de dire « je sais pas » (avant modulation par la suggestibilité).
  values: {"4_6": 0.35, "7_9": 0.2, "10_12": 0.1}
  source: >
    Waterman, Blades & Spencer (2001), Interviewing children and adults: The effect
    of question format on the tendency to speculate, Applied Cognitive Psychology 15(5).
  estimated: true

suggestibility_multiplier_range:
  description: >
    Bornes [min, max] du multiplicateur appliqué aux probabilités d'acquiescement,
    de oui, d'intégration et de confabulation selon la suggestibilité (0 → min, 1 → max).
  value: [0.5, 1.5]
  source: Choix de modélisation.
  estimated: true

# --- Effets des phases préparatoires et dévoilement (#9) --------------------

support_reluctance_drop:
  description: Baisse de la réticence après chaque énoncé de soutien (`support`).
  value: 0.08
  source: >
    Hershkowitz, Lamb & Katz (2014), Allegation rates in forensic child abuse
    investigations: Comparing the revised and standard NICHD protocols, Psychology,
    Public Policy, and Law 20(3) — le soutien du protocole révisé augmente les
    dévoilements des enfants réticents.
  estimated: true

rapport_reluctance_drop:
  description: Baisse de la réticence après chaque invitation de rapport (sujet neutre).
  value: 0.04
  source: Hershkowitz, Lamb & Katz (2014), voir support_reluctance_drop.
  estimated: true

ground_rule_acquiescence_drop:
  description: >
    Baisse de la propension à acquiescer (et donc à confabuler et à dire oui) après
    chaque règle de base énoncée, dans la limite de max_effective_ground_rules.
  value: 0.12
  source: >
    Brown & Lamb (2015), Child Dev. Perspectives 9(4) — les règles de base (« je ne
    sais pas », corriger l'interviewer) réduisent les erreurs aux questions fermées.
  estimated: true

max_effective_ground_rules:
  description: Nombre de règles de base au-delà duquel une règle supplémentaire n'a plus d'effet.
  value: 3
  source: Choix de modélisation (le protocole NICHD en énonce trois à quatre).
  estimated: true

narrative_practice_verbosity_boost:
  description: >
    Hausse de la verbosité après chaque invitation de pratique narrative, dans la
    limite de max_effective_practice_turns.
  value: 0.1
  source: >
    Sternberg, Lamb, Hershkowitz, Yudilevitch, Orbach, Esplin & Hovav (1997), Effects
    of introductory style on children's abilities to describe experiences of sexual
    abuse, Child Abuse & Neglect 21(11) — une introduction ouverte allonge les
    réponses aux invitations de la phase substantive.
  estimated: true

max_effective_practice_turns:
  description: Nombre d'invitations de pratique narrative au-delà duquel l'effet plafonne.
  value: 3
  source: Choix de modélisation.
  estimated: true

disclosure_threshold_scale:
  description: >
    Seuil de dévoilement = réticence courante × échelle. Chaque incitation portant
    sur l'événement cible ajoute une pression (disclosure_pressure) ; l'enfant
    dévoile quand la pression cumulée atteint le seuil.
  value: 5
  source: >
    Choix de modélisation, d'après la gradation des incitations de transition du
    protocole NICHD (Lamb, Orbach, Hershkowitz, Esplin & Horowitz, 2007, Child Abuse
    & Neglect 31).
  estimated: true

disclosure_pressure:
  description: Pression exercée par une incitation, selon le type de question.
  value: {invitation: 1.0, cued_invitation: 1.0, facilitator: 0.5, directive: 1.5, option_posing: 2.0, suggestive: 3.0}
  source: Choix de modélisation (les incitations focalisées obtiennent le dévoilement plus vite, au prix de la fiabilité).
  estimated: true

no_disclosure_reluctance:
  description: Au-delà de cette réticence courante, l'enfant ne dévoile pas, quelles que soient les incitations.
  value: 0.9
  source: Choix de modélisation (une absence de dévoilement est un résultat légitime).
  estimated: true

p_closure_reveal:
  description: >
    Question de clôture « autre chose ? » : probabilité que l'enfant livre une unité
    centrale encore non dite.
  value: 0.3
  source: Choix de modélisation.
  estimated: true
